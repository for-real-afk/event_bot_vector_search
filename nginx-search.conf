# Drop this file at /etc/nginx/sites-available/event-search
# Then: sudo ln -s /etc/nginx/sites-available/event-search /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;          # replace with your domain or EC2 public IP

    # Search service
    location /search-api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Or expose it directly on its own subdomain:
    # server_name search.yourdomain.com;
    # location / { proxy_pass http://127.0.0.1:8001; ... }
}
